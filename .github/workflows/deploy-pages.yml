name: Deploy resume site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm exec vite build --base=/jianli/
          mkdir -p site/product-manager
          cp -r dist/. site/
          pnpm --dir "产品经理网站" install --frozen-lockfile
          pnpm --dir "产品经理网站" run build --base=/jianli/product-manager/
          cp -r "产品经理网站/dist/." site/product-manager/
          mkdir -p site/foreign-trade
          pnpm --dir "外贸网站" install --frozen-lockfile
          pnpm --dir "外贸网站" run build --base=/jianli/foreign-trade/
          cp -r "外贸网站/dist/." site/foreign-trade/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
